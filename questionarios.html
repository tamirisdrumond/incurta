<!DOCTYPE html>
<html lang="pt" data-title-key="q_pageTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>in.curta — Área do Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root {
    --burgundy: #8B1538;
    --burgundy-vivid: #C41E3A;
    --blush: #D4A5A5;
    --taupe: #936458;
    --espresso: #2C2C2C;
    --cream: #F5EBE0;
    --cream-light: #F5EBE0;
    --gold: #C9A86A;
    --text-dark: #2C2C2C;
    --text-mid: #5a4a3a;
    --text-light: #9A7B78;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-light);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ─── TOP BAR ─── */
  .topbar {
    background: var(--espresso); padding: 1rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar-logo {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 1.2rem; font-weight: 500; color: var(--cream);
    text-decoration: none;
  }
  .topbar-back {
    font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(232,220,215,0.5); text-decoration: none; transition: color 0.2s;
  }
  .topbar-back:hover { color: var(--blush); }

  /* ─── PASSWORD GATE ─── */
  #gate {
    min-height: calc(100vh - 58px);
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1.5rem;
  }
  .gate-card {
    background: #fff; padding: 3.5rem;
    border: 1px solid rgba(201,157,137,0.2);
    max-width: 420px; width: 100%; text-align: center;
  }
  .gate-icon {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1.5px solid var(--burgundy);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem; font-size: 1.2rem; color: var(--burgundy);
  }
  .gate-card h2 {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 1.8rem; font-weight: 400; color: var(--espresso);
    margin-bottom: 0.5rem;
  }
  .gate-card p {
    font-size: 0.85rem; color: var(--text-mid); margin-bottom: 2rem;
    line-height: 1.65; font-weight: 300;
  }
  .gate-input {
    width: 100%; border: 1px solid var(--cream); padding: 0.85rem 1rem;
    font-family: 'Inter', sans-serif; font-size: 1rem;
    color: var(--text-dark); background: var(--cream-light);
    outline: none; transition: border-color 0.2s; margin-bottom: 1rem;
    letter-spacing: 0.08em; text-align: center;
  }
  .gate-input:focus { border-color: var(--burgundy); background: #fff; }
  .gate-error {
    font-size: 0.8rem; color: var(--burgundy); margin-bottom: 0.75rem;
    display: none;
  }
  .btn-primary {
    display: inline-block; padding: 0.95rem 2.5rem;
    background: var(--burgundy); color: #fff;
    font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase;
    font-family: 'Inter', sans-serif; font-weight: 500;
    border: none; cursor: pointer; transition: background 0.2s; width: 100%;
  }
  .btn-primary:hover { background: #6e1029; }
  .btn-primary:disabled { background: var(--blush); cursor: not-allowed; }
  .btn-outline {
    display: inline-block; padding: 0.85rem 2rem;
    background: transparent; color: var(--burgundy);
    font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
    font-family: 'Inter', sans-serif; font-weight: 500;
    border: 1px solid var(--burgundy); cursor: pointer; transition: all 0.2s;
  }
  .btn-outline:hover { background: var(--burgundy); color: #fff; }
  .btn-back-sm {
    background: none; border: none; color: var(--text-light);
    font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500;
    transition: color 0.2s;
  }
  .btn-back-sm:hover { color: var(--text-mid); }

  /* ─── MAIN APP (hidden until login) ─── */
  #app { display: none; }

  /* ─── SELECTOR ─── */
  #selector {
    min-height: calc(100vh - 58px);
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1.5rem;
  }
  .selector-inner { max-width: 700px; width: 100%; }
  .selector-inner h1 {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 2.5rem; font-weight: 300; color: var(--espresso);
    margin-bottom: 0.5rem;
  }
  .selector-inner h1 em { font-style: italic; color: var(--burgundy); }
  .selector-inner .sub {
    font-size: 0.9rem; color: var(--text-mid); margin-bottom: 3rem;
    font-weight: 300; line-height: 1.7;
  }
  .q-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .q-card {
    background: #fff; padding: 2.5rem 2rem;
    border: 1px solid rgba(201,157,137,0.2);
    cursor: pointer; transition: border-color 0.2s, transform 0.15s;
    text-align: left;
  }
  .q-card:hover { border-color: var(--burgundy); transform: translateY(-2px); }
  .q-card-num {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 2.5rem; color: rgba(139,21,54,0.15);
    line-height: 1; margin-bottom: 1rem;
  }
  .q-card h3 {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 1.4rem; font-weight: 500; color: var(--espresso);
    margin-bottom: 0.5rem;
  }
  .q-card p { font-size: 0.82rem; color: var(--text-mid); line-height: 1.65; font-weight: 300; }
  .q-card .q-card-tag {
    display: inline-block; margin-top: 1.25rem;
    font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--burgundy); border: 1px solid rgba(139,21,54,0.25);
    padding: 0.3rem 0.75rem;
  }

  /* ─── FORM AREA ─── */
  #form-area { display: none; padding: 3rem; max-width: 860px; margin: 0 auto; }
  .form-header { margin-bottom: 2.5rem; }
  .form-header .form-title {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 2rem; font-weight: 400; color: var(--espresso); margin-bottom: 0.3rem;
  }
  .form-header .form-title em { font-style: italic; color: var(--burgundy); }
  .form-header .form-sub { font-size: 0.85rem; color: var(--text-mid); font-weight: 300; }

  /* Progress */
  .progress-wrap { margin-bottom: 2.5rem; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.72rem; color: var(--text-light); letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 0.5rem;
  }
  .progress-bar { height: 2px; background: var(--cream); position: relative; }
  .progress-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--burgundy); transition: width 0.4s ease;
  }

  /* Form steps */
  .form-step { display: none; }
  .form-step.visible { display: block; }
  .step-heading {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 1.35rem; font-weight: 500; color: var(--espresso);
    margin-bottom: 0.25rem;
  }
  .step-desc { font-size: 0.82rem; color: var(--text-light); margin-bottom: 2rem; }

  .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; }
  .field label {
    font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-mid); font-weight: 500;
  }
  .field input, .field select, .field textarea {
    border: 1px solid var(--cream); padding: 0.75rem 1rem;
    font-family: 'Inter', sans-serif; font-size: 0.88rem;
    color: var(--text-dark); background: var(--cream-light);
    outline: none; transition: border-color 0.2s; -webkit-appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--burgundy); background: #fff;
  }
  .field textarea { resize: vertical; min-height: 80px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

  /* Checkboxes */
  .check-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .check-option {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem;
    border: 1px solid var(--cream); background: var(--cream-light);
    cursor: pointer; transition: all 0.15s; font-size: 0.85rem; color: var(--text-mid);
    user-select: none;
  }
  .check-option:hover { border-color: var(--blush); }
  .check-option.selected { border-color: var(--burgundy); background: rgba(139,21,54,0.04); color: var(--espresso); }
  .check-box {
    width: 16px; height: 16px; border: 1.5px solid var(--blush);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; color: transparent; transition: all 0.15s;
  }
  .check-option.selected .check-box { border-color: var(--burgundy); background: var(--burgundy); color: #fff; }

  /* Radio */
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-option {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem;
    border: 1px solid var(--cream); background: var(--cream-light);
    cursor: pointer; transition: all 0.15s; font-size: 0.85rem; color: var(--text-mid);
    user-select: none;
  }
  .radio-option:hover { border-color: var(--blush); }
  .radio-option.selected { border-color: var(--burgundy); background: rgba(139,21,54,0.04); color: var(--espresso); }
  .radio-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--blush); flex-shrink: 0; transition: all 0.15s;
  }
  .radio-option.selected .radio-dot { border-color: var(--burgundy); background: var(--burgundy); }

  /* Scale */
  .scale-wrap { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .scale-label { font-size: 0.72rem; color: var(--text-light); }
  .scale-btn {
    width: 42px; height: 42px; border: 1px solid var(--cream);
    background: var(--cream-light); font-size: 0.85rem; color: var(--text-mid);
    cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .scale-btn:hover { border-color: var(--blush); }
  .scale-btn.selected { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }

  /* Nav */
  .form-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--cream);
  }

  /* Success */
  #form-success {
    display: none; text-align: center; padding: 5rem 2rem;
  }
  .success-icon {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--burgundy); margin: 0 auto 1.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; color: var(--burgundy);
  }
  #form-success h2 {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    font-size: 2rem; font-weight: 400; color: var(--espresso); margin-bottom: 0.75rem;
  }
  #form-success p { font-size: 0.9rem; color: var(--text-mid); line-height: 1.7; max-width: 440px; margin: 0 auto 2rem; }

  /* Spinner */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 700px) {
    .q-cards { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
    #form-area { padding: 1.5rem; }
    .topbar { padding: 1rem 1.5rem; }
    .topbar-back { display: none; }   /* hide "← back to site" on small screens; toggle stays */
  }

  /* ─── LANGUAGE TOGGLE ─── */
  .lang-toggle { display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.15); overflow: hidden; }
  .lang-btn { padding: 0.3rem 0.65rem; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Inter', sans-serif; color: rgba(232,220,215,0.5); background: transparent; border: none; cursor: pointer; transition: all 0.2s; line-height: 1; }
  .lang-btn:hover { color: var(--blush); }
  .lang-btn.active { background: var(--burgundy); color: #fff; }
  .lang-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<!-- Translations engine (shared with index.html) -->
<script src="translations.js"></script>

<!-- TOP BAR -->
<div class="topbar">
  <a href="index.html" class="topbar-logo"><img src="images/logo-white.png" alt="in.curta" style="height:36px;width:auto;display:block;"></a>
  <div style="display:flex;align-items:center;gap:1.5rem;">
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="pt">PT</button>
      <div class="lang-divider"></div>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
    <a href="index.html" class="topbar-back" data-i18n="q_backToSite">← Voltar ao site</a>
  </div>
</div>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h2 data-i18n="q_gateTitle">Área do Cliente</h2>
    <p data-i18n="q_gateDesc">Esta área é exclusiva para clientes do programa in.curta.<br>Insira o código de acesso fornecido pela Tamiris.</p>
    <div id="gate-input-wrap"></div>
    <div class="gate-error" id="gate-error" data-i18n="q_gateError">Código incorreto. Tente novamente.</div>
    <button class="btn-primary" id="gate-btn" onclick="checkPassword()" data-i18n="q_gateBtn">Entrar</button>
  </div>
</div>

<!-- MAIN APP: loaded dynamically after authentication -->
<div id="app"></div>

<script>
  // ─── STEPS CONFIG ─────────────────────────────────────────
  const TOTAL_STEPS = { fisica: 7, emocional: 8 };
  let activeForm = null;
  let activeStep = 1;

  // ─── ODOO WAKE-UP (background, non-blocking) ───────────────
  // Odoo sleeps when idle and can take well over a minute to wake up — too
  // long to make a client wait at submit time. Instead we start pinging it
  // in the background as soon as the user is inside the app (right after the
  // password gate), well before they reach any submit button.
  //
  // Each /api/wake-odoo call holds a connection open for up to ~55s (that's
  // how long a sleeping instance's proxy takes to respond once ready — it
  // doesn't fail fast). So pings are chained sequentially, one at a time,
  // waiting for each to finish before firing the next — never overlapping —
  // rather than firing on a fixed interval which would stack up many
  // concurrent long-lived requests. The submit endpoint still retries on its
  // own as a fallback for anyone who submits before this completes.
  let _odooAwake = false;
  let _odooWaking = false;
  function startOdooWakeup() {
    if (_odooAwake || _odooWaking) return;
    _odooWaking = true;
    (async function loop() {
      while (!_odooAwake) {
        try {
          const res = await fetch('/api/wake-odoo', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (data.awake) { _odooAwake = true; break; }
        } catch (e) { /* try again below */ }
        await new Promise(r => setTimeout(r, 2000));
      }
      _odooWaking = false;
    })();
  }

  // ─── GATE ─────────────────────────────────────────────────
  async function checkPassword() {
    const pwd = document.getElementById('gate-access-field').value;
    const err = document.getElementById('gate-error');
    const btn = document.getElementById('gate-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/verify-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd, lang: localStorage.getItem('incurta-lang') || 'pt' })
      });
      const data = await res.json();
      if (data.ok && data.html) {
        // Store password for subsequent per-questionnaire fetches
        window._clientPwd = pwd;
        const appEl = document.getElementById('app');
        appEl.innerHTML = data.html;
        document.getElementById('gate').style.display = 'none';
        appEl.style.display = 'block';
        // Re-apply translations so shell elements with data-i18n render in active lang
        applyTranslations(getLang());
        window.scrollTo(0, 0);
        // Start waking Odoo in the background now — by the time the user
        // finishes a questionnaire and hits submit, it's very likely already awake.
        startOdooWakeup();
      } else {
        err.style.display = 'block';
        document.getElementById('gate-access-field').value = '';
        document.getElementById('gate-access-field').focus();
      }
    } catch(e) {
      err.textContent = t('q_gateConnError');
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }
  // Build password input with JS after page load so password managers never scan it
  (function() {
    var wrap = document.getElementById('gate-input-wrap');
    var inp = document.createElement('input');
    inp.setAttribute('type', 'text');           // NOT type="password" — avoids all PW manager detection
    inp.setAttribute('id', 'gate-access-field');
    inp.setAttribute('class', 'gate-input');
    inp.setAttribute('placeholder', '••••••••••••');
    inp.setAttribute('autocomplete', 'off');
    inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('autocapitalize', 'off');
    inp.setAttribute('spellcheck', 'false');
    inp.style.webkitTextSecurity = 'disc';      // visually mask on Safari/Chrome
    inp.style.fontFamily = 'monospace';
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
    wrap.appendChild(inp);
    // Focus after short delay so it feels natural
    setTimeout(function() { inp.focus(); }, 200);
  })();

  // ─── STEP 1 VALIDATION ───────────────────────────────────────
  function validateStep1(form) {
    const prefix = form === 'fisica' ? 'f' : 'e';
    const name  = document.getElementById(prefix + '-nome') ? document.getElementById(prefix + '-nome').value.trim() : '';
    const email = document.getElementById(prefix + '-email') ? document.getElementById(prefix + '-email').value.trim() : '';
    const err   = document.getElementById(prefix + '-step1-error');
    const emailOk = !!email && email.includes('@') && email.includes('.');
    if (!name || !emailOk) {
      err.style.display = 'block';
      if (!name) document.getElementById(prefix + '-nome').focus();
      else document.getElementById(prefix + '-email').focus();
      return;
    }
    err.style.display = 'none';
    nextStep(form, 1, 2);
  }


  function backToSelector() {
    activeForm = null;
    activeStep = 1;
    document.querySelectorAll('.form-step').forEach(s => s.remove());
    const cardsEl = document.querySelector('.q-cards');
    if (cardsEl && !cardsEl.querySelector('.q-card')) {
      cardsEl.innerHTML = `
        <div class="q-card" onclick="openForm('fisica')">
          <div class="q-card-num">01</div>
          <h3>${t('q_card1Title')}</h3>
          <p>${t('q_card1Desc')}</p>
          <span class="q-card-tag">${t('q_card1Tag')}</span>
        </div>
        <div class="q-card" onclick="openForm('emocional')">
          <div class="q-card-num">02</div>
          <h3>${t('q_card2Title')}</h3>
          <p>${t('q_card2Desc')}</p>
          <span class="q-card-tag">${t('q_card2Tag')}</span>
        </div>
        <div class="q-card" onclick="openQfa()">
          <div class="q-card-num">03</div>
          <h3>${t('q_card3Title')}</h3>
          <p>${t('q_card3Desc')}</p>
          <span class="q-card-tag">${t('q_card3Tag')}</span>
        </div>`;
    }
    document.getElementById('selector').style.display = 'flex';
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('form-success').style.display = 'none';
    window.scrollTo(0, 0);
  }

  // ─── STEP NAVIGATION ──────────────────────────────────────
  function showStep(form, n) {
    document.querySelectorAll('.form-step').forEach(s => s.classList.remove('visible'));
    const el = document.getElementById(`${form[0]}-step-${n}`);
    if (el) el.classList.add('visible');
    activeStep = n;
    updateProgress(form, n);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function nextStep(form, from, to) {
    showStep(form, to);
  }

  function updateProgress(form, n) {
    const total = TOTAL_STEPS[form];
    const pct = Math.round((n / total) * 100);
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('prog-step-label').textContent = t('q_step').replace('{n}', n).replace('{total}', total);
    document.getElementById('prog-pct').textContent = pct + '%';
  }

  // ─── INTERACTIVE CONTROLS ─────────────────────────────────
  function selectRadio(el, groupId) {
    document.querySelectorAll(`#${groupId} .radio-option`).forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  }

  function toggleCheck(el) {
    el.classList.toggle('selected');
  }

  function selectScale(el, groupId) {
    document.querySelectorAll(`#${groupId} .scale-btn`).forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  }

  // ─── HELPERS ──────────────────────────────────────────────
  function getRadioVal(groupId) {
    const sel = document.querySelector(`#${groupId} .radio-option.selected`);
    return sel ? sel.textContent.trim() : '';
  }

  function getCheckedVals(groupId) {
    return [...document.querySelectorAll(`#${groupId} .check-option.selected`)]
      .map(el => el.textContent.trim()).join(', ');
  }

  function getScaleVal(groupId) {
    const sel = document.querySelector(`#${groupId} .scale-btn.selected`);
    return sel ? sel.textContent.trim() : '';
  }

  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

    // ─── SUBMIT (via server-side API — credentials never exposed to browser) ───────
  async function submitForm(type) {
    const nameId  = type === 'fisica' ? 'f-nome'  : 'e-nome';
    const emailId = type === 'fisica' ? 'f-email' : 'e-email';
    const name  = val(nameId);
    const email = val(emailId);

    if (!name || !email) {
      alert(t('q_alertFillNameEmail'));
      showStep(type, 1);
      return;
    }

    const btn = document.getElementById(`submit-${type}`);
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>${t('q_sending')}`;

    const note = type === 'fisica' ? buildFisicaNote() : buildEmocionalNote();

    try {
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, name, email, note })
      });
      const resData = await res.json().catch(() => ({}));
      if (!res.ok || !resData.ok) {
        const e = new Error(resData.detail || resData.error || `HTTP ${res.status}`);
        e.serverDetail = resData.detail || resData.error || `HTTP ${res.status}`;
        throw e;
      }

      document.querySelector(`#${type[0]}-step-${TOTAL_STEPS[type]}`).classList.remove('visible');
      document.getElementById('form-success').style.display = 'block';
      window.scrollTo(0, 0);
    } catch (err) {
      console.error(err);
      const errMsg = err.serverDetail || err.message || 'erro desconhecido';
      document.getElementById('submit-error-msg') && (document.getElementById('submit-error-msg').textContent = 'Erro: ' + errMsg);
      alert(t('q_alertSendError') + errMsg);
      btn.disabled = false;
      btn.innerHTML = t('q_submitBtn');
    }
  }
  // ─── ON-DEMAND QUESTIONNAIRE LOADER ──────────────────────
  // resumeStep: if provided, re-opens at that step (used by setLang re-fetch).
  // When called from a card click, resumeStep is undefined → starts at step 1.
  async function openForm(type, resumeStep) {
    const routes = { fisica: '/api/form-fisica', emocional: '/api/form-emocional' };
    const route = routes[type];
    if (!route) return;

    // Only show loading state when opening fresh from the selector (not on re-fetch)
    if (!resumeStep) {
      const cards = document.querySelector('.q-cards');
      if (cards) cards.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-light);font-size:0.88rem;">${t('q_loading')}</div>`;
    }

    try {
      const res = await fetch(route, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: window._clientPwd, lang: localStorage.getItem('incurta-lang') || 'pt' })
      });
      const data = await res.json();
      if (!data.ok || !data.html) throw new Error('load failed');

      // Remove any previously injected steps
      document.querySelectorAll('.form-step').forEach(s => s.remove());
      // Inject new steps before the success state
      const stepContainer = document.getElementById('form-area');
      const successEl = document.getElementById('form-success');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = data.html;
      tempDiv.querySelectorAll('.form-step').forEach(s => {
        stepContainer.insertBefore(s, successEl);
      });

      activeForm = type;
      activeStep = resumeStep || 1;
      document.getElementById('selector').style.display = 'none';
      document.getElementById('form-area').style.display = 'block';
      document.getElementById('form-success').style.display = 'none';

      const titles = {
        fisica:    { t: t('q_formTitleFisica'),    s: t('q_formSub') },
        emocional: { t: t('q_formTitleEmocional'), s: t('q_formSub') }
      };
      document.getElementById('form-title').innerHTML = titles[type].t;
      document.getElementById('form-sub').textContent = titles[type].s;
      showStep(type, activeStep);
      // Only scroll to top on fresh open, not on silent re-fetch
      if (!resumeStep) window.scrollTo(0, 0);
    } catch(e) {
      console.error('Form load error:', e);
      if (!resumeStep) {
        document.getElementById('selector').style.display = 'flex';
        document.getElementById('app').innerHTML = `<p style="padding:2rem;color:var(--burgundy)">${t('q_loadError')}</p>`;
      }
    }
  }

  async function openQfa(resumeQfaStep) {
    if (!resumeQfaStep) {
      const cards = document.querySelector('.q-cards');
      if (cards) cards.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-light);font-size:0.88rem;">${t('q_loading')}</div>`;
    }

    try {
      const res = await fetch('/api/form-qfa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: window._clientPwd, lang: localStorage.getItem('incurta-lang') || 'pt' })
      });
      const data = await res.json();
      if (!data.ok || !data.html) throw new Error('load failed');

      const appEl = document.getElementById('app');

      // On re-fetch (lang change): replace existing qfa-section in-place
      const existing = document.getElementById('qfa-section');
      if (existing) existing.remove();

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = data.html;
      // Inject styles (deduplicate by checking existing)
      tempDiv.querySelectorAll('style').forEach(s => {
        if (!document.head.querySelector(`style[data-qfa]`)) {
          s.setAttribute('data-qfa', '1');
          document.head.appendChild(s);
        }
      });
      // Inject / replace scripts
      document.querySelectorAll('script[data-qfa]').forEach(s => s.remove());
      tempDiv.querySelectorAll('script').forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        ns.setAttribute('data-qfa', '1');
        document.body.appendChild(ns);
        s.remove();
      });
      // Drain all element children (HTML starts with a comment, so firstElementChild
      // is safe here, but looping is more robust)
      while (tempDiv.firstChild) {
        if (tempDiv.firstChild.nodeType === 8) { // comment node — skip
          tempDiv.removeChild(tempDiv.firstChild);
        } else {
          appEl.appendChild(tempDiv.firstChild);
        }
      }

      // _qfaReveal() is defined in the injected script; show the section
      if (typeof _qfaReveal === 'function') _qfaReveal();
      else {
        document.getElementById('selector').style.display = 'none';
        const qs = document.getElementById('qfa-section');
        if (qs) qs.style.display = 'block';
      }
      // If resuming at a specific QFA step, navigate there
      if (resumeQfaStep && typeof qfaGoStep === 'function') {
        qfaGoStep(resumeQfaStep);
      }
      if (!resumeQfaStep) window.scrollTo(0, 0);
    } catch(e) {
      console.error('QFA load error:', e);
    }
  }

  // ─── LANG CHANGE HOOK ─────────────────────────────────────────────────────
  // When the user switches language:
  //  1. Persist choice and re-apply data-i18n translations (shell, topbar, gate).
  //  2. If a standard form (fisica/emocional) is open, re-fetch its steps in the
  //     new language and resume at the current step — user loses no progress position.
  //  3. If QFA is open, re-fetch and resume at the current QFA step.
  //  4. If the selector is showing (no form open), just re-applying translations
  //     already handles the selector cards via data-i18n.
  //
  // NOTE: field values typed so far are lost on re-fetch. This is unavoidable
  // because the form HTML is server-rendered and cannot be patched in-place.
  // Users who have started filling in answers should finish before switching lang.
  function setLang(lang) {
    localStorage.setItem('incurta-lang', lang);
    applyTranslations(lang);

    // Re-fetch open form in new language, resuming at current step
    if (activeForm && document.getElementById('form-area') &&
        document.getElementById('form-area').style.display !== 'none') {
      openForm(activeForm, activeStep);
      return;
    }

    // Re-fetch QFA if it's open
    const qfaSection = document.getElementById('qfa-section');
    if (qfaSection && qfaSection.style.display !== 'none') {
      // Detect current QFA step
      let qfaStep = 1;
      if (document.getElementById('qfa-step-food') &&
          document.getElementById('qfa-step-food').style.display !== 'none') qfaStep = 2;
      if (document.getElementById('qfa-step-result') &&
          document.getElementById('qfa-step-result').style.display !== 'none') qfaStep = 3;
      openQfa(qfaStep);
    }
  }

</script>
